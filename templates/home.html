<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Diabetes Prediction</h1>
    <form action="{{ url_for('predict_datapoint')}}" method="post">
        <label for="pregnancies">Number of Pregnancies:</label>
        <input id="pregnancies" name="pregnancies" type="number" min="0" max="20" placeholder="e.g. 3" required>

        <label for="glucose">Glucose Level:</label>
        <input id="glucose" name="glucose" type="number" min="0" max="300" placeholder="e.g. 120" required>

        <label for="blood_pressure">Blood Pressure (mm Hg):</label>
        <input id="blood_pressure" name="blood_pressure" type="number" min="0" max="200" placeholder="e.g. 70" required>

        <label for="skin_thickness">Skin Thickness (mm):</label>
        <input id="skin_thickness" name="skin_thickness" type="number" min="0" max="100" placeholder="e.g. 20" required>

        <label for="insulin">Insulin Level (mu U/ml):</label>
        <input id="insulin" name="insulin" type="number" min="0" max="900" placeholder="e.g. 85" required>

        <label for="bmi">BMI:</label>
        <input id="bmi" name="bmi" type="number" step="0.1" min="0" max="70" placeholder="e.g. 33.6" required>

        <label for="diabetes_pedigree_function">Diabetes Pedigree Function Value:</label>
        <input id="diabetes_pedigree_function" name="diabetes_pedigree_function" type="number" step="0.001" min="0" max="2.5" placeholder="e.g. 0.627" required>

        <label for="age">Age:</label>
        <input id="age" name="age" type="number" min="0" max="120" placeholder="e.g. 45" required>

        <button type="submit">Predict</button>
    </form>
    <h2>The prediction is {{results}}</h2>
</body>
</html>
