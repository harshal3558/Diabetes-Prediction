<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        /* RESULT ALIGNMENT */
        .result-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
        .result-container iframe {
            width: 230px;
            height: 40px;
            border: none;
        }
    </style>
</head>
<body>

<h1>Diabetes Prediction</h1>

<form 
    action="{{ url_for('predict_datapoint') }}" 
    method="post"
    target="resultFrame"
>
    <label>Number of Pregnancies:</label>
    <input name="pregnancies" type="number" min="0" max="20" required>

    <label>Glucose Level:</label>
    <input name="glucose" type="number" min="0" max="300" required>

    <label>Blood Pressure (mm Hg):</label>
    <input name="blood_pressure" type="number" min="0" max="200" required>

    <label>Skin Thickness (mm):</label>
    <input name="skin_thickness" type="number" min="0" max="100" required>

    <label>Insulin Level:</label>
    <input name="insulin" type="number" min="0" max="900" required>

    <label>BMI:</label>
    <input name="bmi" type="number" step="0.1" min="0" max="70" required>

    <label>Diabetes Pedigree Function:</label>
    <input name="diabetes_pedigree_function" type="number" step="0.001" min="0" max="2.5" required>

    <label>Age:</label>
    <input name="age" type="number" min="0" max="120" required>

    <button type="submit">Predict</button>
</form>

<div class="result-container">
    <span>Prediction Result:</span>
    <iframe name="resultFrame"></iframe>
</div>

</body>
</html>
